[project]
name = "cardinal-duck"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "duckdb==2.0.0",
    "pandas==3.0.6",
    "sorobn",
    "sqlglot==30.22.0",
]

[tool.uv.sources]
sorobn = { path = "vendor/sorobn", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
norecursedirs = ["vendor", "data", ".venv", "duckdb", "extension-ci-tools", "build"]
