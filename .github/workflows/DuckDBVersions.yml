#
# Daily: when DuckDB has a new release, opens a branch and a PR that move the extension to it,
# then builds and checks the branch. A red check means the release needs a port, see
# docs/upgrading.md.
#
name: DuckDB versions
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'A DuckDB release, e.g. v2.1.0. Empty: the latest.'
        required: false

permissions:
  contents: read
  pull-requests: write
  actions: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Move to the release
        id: move
        env:
          GH_TOKEN: ${{ github.token }}
          DUCKDB_VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch=$(scripts/upgrade_duckdb.sh "$DUCKDB_VERSION")
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      # The upgrade changes a workflow file, so the push needs a deploy key.
      - name: Push the upgrade branch
        if: steps.move.outputs.branch != ''
        env:
          BRANCH: ${{ steps.move.outputs.branch }}
          DUCKDB_UPGRADE_KEY: ${{ secrets.DUCKDB_UPGRADE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$DUCKDB_UPGRADE_KEY" ]; then
            echo "::error::Set the DUCKDB_UPGRADE_KEY Actions secret."
            exit 1
          fi

          key_dir=$(mktemp -d)
          trap 'rm -rf "$key_dir"' EXIT
          umask 077
          printf '%s\n' "$DUCKDB_UPGRADE_KEY" > "$key_dir/key"
          unset DUCKDB_UPGRADE_KEY
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$key_dir/known_hosts"
          git -c core.sshCommand="ssh -i \"$key_dir/key\" -o IdentitiesOnly=yes -o UserKnownHostsFile=\"$key_dir/known_hosts\" -o StrictHostKeyChecking=yes" \
            push "git@github.com:${GITHUB_REPOSITORY}.git" "$BRANCH"

      # The distribution and gate workflows need explicit dispatches for this branch.
      - name: Build and check the branch
        if: steps.move.outputs.branch != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.move.outputs.branch }}
        run: |
          gh workflow run MainDistributionPipeline.yml --ref "$BRANCH"
          gh workflow run Gate.yml --ref "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "Upgrade to ${BRANCH#duckdb-}" --body-file - <<'EOF'
          This PR updates the DuckDB and extension-ci-tools submodules. It also updates the version pins for CI and research.

          The checks build the extension and run the extension tests, DuckDB SQL tests, and stress test.
          If a check fails, see `docs/upgrading.md`.
          EOF
