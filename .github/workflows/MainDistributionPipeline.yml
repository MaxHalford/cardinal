#
# Builds and tests the extension with DuckDB's own extension pipeline, as the community
# extensions repository does for releases.
#
# Pushes to main build Linux, for fast feedback, and check formatting. PRs, the weekly run and
# manual runs (e.g. a DuckDB upgrade branch) build every platform and run clang-tidy.
#
name: Main Extension Distribution Pipeline
on:
  push:
    branches: [main]
    paths-ignore: ['research/**', 'docs/**', '**.md']
  pull_request:
    paths-ignore: ['research/**', 'docs/**', '**.md']
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v2.0-cyanoptera
    with:
      duckdb_version: v2.0.0
      ci_tools_version: v2.0-cyanoptera
      extension_name: cardinal
      # Fitting runs on worker threads: wasm builds lack them.
      exclude_archs: ${{ github.event_name == 'push' && 'linux_arm64;linux_amd64_musl;linux_arm64_musl;osx_amd64;osx_arm64;windows_amd64;windows_amd64_mingw;windows_arm64;wasm_mvp;wasm_eh;wasm_threads' || 'wasm_mvp;wasm_eh;wasm_threads' }}

  # DuckDB's formatting (clang-format 11) and static analysis (clang-tidy) rules.
  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@v2.0-cyanoptera
    with:
      duckdb_version: v2.0.0
      ci_tools_version: v2.0-cyanoptera
      extension_name: cardinal
      format_checks: ${{ github.event_name == 'push' && 'format' || 'format;tidy' }}
